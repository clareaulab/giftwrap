name: giftwrap_sc_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - bioconda::cutadapt=5.2
  - bioconda::nextflow=26.04.0
  - pip
  - pip:
    - giftwrap-sc==0.4.1
    - scanpy==1.11.5
    - jupyterlab==4.5.6
    - bio        # pulls in gprofiler-official and mygene
    - kneed      # not a dep of anything else
